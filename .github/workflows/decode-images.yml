name: decode-images
on:
  push:
    paths:
      - "_incoming/**"
      - ".github/workflows/decode-images.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 images
        run: |
          shopt -s nullglob
          for f in _incoming/*/*.b64; do
            dir="$(basename "$(dirname "$f")")"
            name="$(basename "$f" .b64)"
            mkdir -p "instagram/$dir"
            base64 -d "$f" > "instagram/$dir/$name.jpg"
            git rm -q "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add instagram
          git commit -m "Decode promo images" || echo "nothing to commit"
          git push
